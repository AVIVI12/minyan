<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מניין לייב - עם זמני היום</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        .screen { display: none; min-height: 100vh; }
        .screen.active { display: flex; flex-direction: column; }
        #map { height: 180px; width: 100%; border-radius: 15px; z-index: 10; }
        .zman-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #e2e8f0; font-size: 0.85rem; }
        .btn-disabled { filter: grayscale(1); opacity: 0.6; cursor: not-allowed !important; }
        .pulse-now { animation: pulse 2s infinite; border: 3px solid #3b82f6 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 overflow-x-hidden">

    <div class="max-w-md mx-auto bg-white shadow-2xl min-h-screen relative flex flex-col">
        
        <!-- Header קבוע לכל המסכים -->
        <header class="bg-slate-900 p-4 text-white flex justify-between items-center shadow-md">
            <div>
                <h1 class="font-black italic text-xl">MinyanLive</h1>
                <p id="live-clock" class="text-blue-400 font-mono text-xs font-bold">00:00:00</p>
            </div>
            <div id="header-loc" class="text-[10px] text-gray-400 text-left">טוען מיקום...</div>
        </header>

        <!-- מסך 1: רישום -->
        <section id="screen-auth" class="screen p-8 text-center justify-center space-y-6">
            <div class="text-6xl">🕍</div>
            <h1 class="text-3xl font-black text-slate-800">שלום!</h1>
            <p class="text-gray-500">נרשמים פעם אחת וזהו.</p>
            <input type="text" id="reg-name" placeholder="שם מלא" class="w-full p-4 border rounded-2xl bg-gray-50 outline-none focus:ring-2 ring-blue-500 text-center">
            <input type="tel" id="reg-phone" placeholder="מספור טלפון" class="w-full p-4 border rounded-2xl bg-gray-50 outline-none focus:ring-2 ring-blue-500 text-center">
            <button onclick="register()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg">כניסה למערכת</button>
        </section>

        <!-- מסך 2: בחירת תפילה + לוח זמנים -->
        <section id="screen-select" class="screen p-5 space-y-6">
            <div class="bg-slate-50 p-4 rounded-3xl border border-blue-100 shadow-inner">
                <h3 class="font-bold text-center text-blue-900 mb-3 border-b pb-2">📅 זמני היום (לפי מיקומך)</h3>
                <div id="zmanim-board" class="space-y-1">
                    <p class="text-center text-xs text-gray-400 animate-pulse">מחשב זמני הלכה...</p>
                </div>
            </div>

            <div class="space-y-3">
                <h3 class="font-bold text-lg px-2">בחר תפילה:</h3>
                <button id="btn-shacharit" class="w-full p-6 bg-white border-2 rounded-3xl text-xl font-black transition relative overflow-hidden">🌅 שחרית</button>
                <button id="btn-mincha" class="w-full p-6 bg-white border-2 rounded-3xl text-xl font-black transition relative overflow-hidden">☀️ מנחה</button>
                <button id="btn-arvit" class="w-full p-6 bg-white border-2 rounded-3xl text-xl font-black transition relative overflow-hidden">🌙 ערבית</button>
            </div>
            
            <p id="wait-msg" class="text-center text-red-500 text-xs font-bold min-h-[20px]"></p>
        </section>

        <!-- מסך 3: הלובי המרכזי -->
        <section id="screen-main" class="screen flex-grow">
            <div class="bg-blue-600 p-3 text-white flex justify-between items-center shadow-lg">
                <button onclick="showScreen('screen-select')" class="text-xs bg-blue-700 px-3 py-1 rounded-full">⬅️ שנה תפילה</button>
                <div class="text-center">
                    <h2 id="current-prayer-title" class="font-black">---</h2>
                </div>
                <div class="w-16"></div>
            </div>

            <div class="p-4 space-y-4 overflow-y-auto pb-24">
                <div id="map" class="shadow-md"></div>
                <div class="flex justify-between items-center">
                    <h3 class="font-bold border-r-4 border-blue-500 pr-2">התארגנויות בסביבה</h3>
                    <button onclick="createNewMinyan()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg active:scale-95 transition">+ פתח חדש</button>
                </div>
                <div id="minyan-list" class="space-y-4"></div>
            </div>
        </section>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAg0jP2EHnCkNJFxyaaY-CrHDjntYm4Oao",
            authDomain: "munyan-3d2dc.firebaseapp.com",
            projectId: "munyan-3d2dc",
            storageBucket: "munyan-3d2dc.firebasestorage.app",
            messagingSenderId: "145100344366",
            appId: "1:145100344366:web:daef855ba6e695c4c923bf"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let user = JSON.parse(localStorage.getItem('mUser')) || null;
        let userPos = null;
        let zmanim = null;
        let map = null;

        // שעון חי
        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('he-IL');
        }, 1000);

        window.onload = () => {
            if (!user) showScreen('screen-auth');
            else getInitialLocation();
        };

        function getInitialLocation() {
            document.getElementById('header-loc').innerText = "מאתר מיקום...";
            navigator.geolocation.getCurrentPosition(async pos => {
                userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                document.getElementById('header-loc').innerText = `📍 ${userPos.lat.toFixed(3)}, ${userPos.lng.toFixed(3)}`;
                await loadZmanim();
                showScreen('screen-select');
            });
        }

        async function loadZmanim() {
            try {
                const res = await fetch(`https://www.hebcal.com/zmanim?cfg=json&latitude=${userPos.lat}&longitude=${userPos.lng}`);
                const data = await res.json();
                zmanim = data.times;
                renderZmanimBoard();
                setupButtons();
            } catch (e) {
                alert("שגיאה בטעינת זמני הלכה");
            }
        }

        function renderZmanimBoard() {
            const board = document.getElementById('zmanim-board');
            const list = [
                { label: "🌅 הנץ החמה", key: "sunrise" },
                { label: "📜 סוף זמן ק''ש (גר''א)", key: "sofZmanShma" },
                { label: "🕍 סוף זמן תפילה (גר''א)", key: "sofZmanTfilla" },
                { label: "☀️ חצות היום", key: "chatzot" },
                { label: "☀️ מנחה גדולה", key: "minchaGedola" },
                { label: "🌇 שקיעה", key: "sunset" },
                { label: "🌙 צאת הכוכבים", key: "tzeit7085deg" }
            ];

            board.innerHTML = list.map(z => `
                <div class="zman-item">
                    <span class="text-gray-600">${z.label}:</span>
                    <span class="font-mono font-bold text-blue-700">${new Date(zmanim[z.key]).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'})}</span>
                </div>
            `).join('');
        }

        function setupButtons() {
            const now = new Date();
            
            // לוגיקת שחרית
            handleBtn('btn-shacharit', 
                now < new Date(zmanim.sofZmanTfilla) && now > new Date(new Date(zmanim.sunrise).getTime() - 40*60000), 
                "זמן שחרית עבר", "שחרית (הזמן הכי קרוב)");

            // לוגיקת מנחה
            handleBtn('btn-mincha', 
                now > new Date(zmanim.minchaGedola) && now < new Date(zmanim.sunset), 
                "עדיין לא זמן מנחה", "מנחה (הזמן הכי קרוב)");

            // לוגיקת ערבית
            handleBtn('btn-arvit', 
                now > new Date(new Date(zmanim.sunset).getTime() - 15*60000), 
                "טרם הגיע זמן ערבית", "ערבית (הזמן הכי קרוב)");
        }

        function handleBtn(id, isPossible, errorMsg, prayerName) {
            const btn = document.getElementById(id);
            if (!isPossible) {
                btn.classList.add('btn-disabled');
                btn.onclick = () => { document.getElementById('wait-msg').innerText = errorMsg; };
            } else {
                btn.classList.remove('btn-disabled');
                btn.classList.add('pulse-now');
                btn.onclick = () => startMinyanLook(prayerName.split(' ')[0]);
            }
        }

        function startMinyanLook(prayer) {
            document.getElementById('current-prayer-title').innerText = "מנייני " + prayer;
            showScreen('screen-main');
            setTimeout(() => {
                if (!map) {
                    map = L.map('map').setView([userPos.lat, userPos.lng], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                } else {
                    map.setView([userPos.lat, userPos.lng], 15);
                }
                L.marker([userPos.lat, userPos.lng]).addTo(map);
                listenToFirebase(prayer);
            }, 100);
        }

        function listenToFirebase(prayer) {
            const hourAgo = new Date(Date.now() - 3600000);
            db.collection("active_minyans")
                .where("prayer", "==", prayer)
                .where("createdAt", ">", hourAgo)
                .onSnapshot(snap => {
                    const list = document.getElementById('minyan-list');
                    list.innerHTML = "";
                    snap.forEach(doc => {
                        const data = doc.data();
                        const dist = getDist(userPos.lat, userPos.lng, data.lat, data.lng);
                        if (dist < 3) renderCard(doc.id, data, dist);
                    });
                });
        }

        function renderCard(id, data, dist) {
            const isJoined = data.participants.some(p => p.phone === user.phone);
            document.getElementById('minyan-list').innerHTML += `
                <div class="bg-white border rounded-2xl p-4 shadow-sm relative border-r-8 border-blue-600">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-gray-800">${data.creator} מחפש עשירי</h4>
                            <p class="text-[10px] text-gray-400 italic">מרחק: ${Math.round(dist*1000)} מטר</p>
                        </div>
                        <div class="bg-blue-50 px-3 py-1 rounded-lg text-xl font-black text-blue-700">${data.participants.length}/10</div>
                    </div>
                    <div class="mt-2 space-y-1">
                        ${data.participants.map(p => `<div class="text-[10px] bg-gray-50 p-1 flex justify-between"><span>👤 ${p.name}</span><a href="tel:${p.phone}" class="text-blue-600">התקשר 📞</a></div>`).join('')}
                    </div>
                    ${!isJoined ? `<button onclick="joinMinyan('${id}')" class="w-full bg-blue-600 text-white font-bold py-2 mt-2 rounded-xl text-sm">אני מצטרף!</button>` : `<p class="text-center text-green-600 font-bold mt-2 text-xs">אתה רשום ✅</p>`}
                </div>`;
        }

        async function createNewMinyan() {
            const prayer = document.getElementById('current-prayer-title').innerText.replace('מנייני ', '');
            db.collection("active_minyans").add({
                prayer, creator: user.name, phone: user.phone,
                lat: userPos.lat, lng: userPos.lng,
                participants: [{ name: user.name, phone: user.phone }],
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        async function joinMinyan(id) {
            const ref = db.collection("active_minyans").doc(id);
            ref.update({ participants: firebase.firestore.FieldValue.arrayUnion({ name: user.name, phone: user.phone }) });
        }

        function register() {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            if(!name || !phone) return alert("מלא פרטים");
            user = { name, phone };
            localStorage.setItem('mUser', JSON.stringify(user));
            getInitialLocation();
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function getDist(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2-lat1) * Math.PI/180;
            const dLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
</html>
