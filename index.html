<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מניין לייב - התראות מניין בזמן אמת</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (Compat Version for ease of use in HTML) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Leaflet Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        #map { height: 280px; border-radius: 16px; margin: 15px 0; border: 1px solid #e2e8f0; }
        .minyan-card { border-right: 6px solid #ef4444; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 
                           70% { transform: scale(1.03); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 
                           100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50 font-sans text-slate-800">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col">
        <!-- Header -->
        <header class="bg-blue-700 text-white p-6 shadow-lg flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-black tracking-tight">MinyanLive</h1>
                <p class="text-blue-200 text-xs mt-1">מוצאים מניין ברדיוס הליכה</p>
            </div>
            <div id="status-dot" class="flex items-center gap-2 text-[10px] font-bold bg-blue-800 px-3 py-1 rounded-full border border-blue-600">
                <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> מחובר לענן
            </div>
        </header>

        <main class="p-5 flex-grow space-y-6">

            <!-- Registration Screen -->
            <div id="auth-section" class="space-y-4 py-10">
                <div class="text-center">
                    <div class="text-6xl mb-4">🕍</div>
                    <h2 class="text-xl font-bold">הצטרפות למערכת ההתראות</h2>
                    <p class="text-gray-500 text-sm">הזן פרטים כדי שנעדכן אותך כשמתארגן מניין</p>
                </div>
                <input type="text" id="user-name" placeholder="שם מלא" class="w-full p-4 bg-gray-100 rounded-xl outline-none focus:ring-2 ring-blue-500 border-none shadow-inner">
                <input type="tel" id="user-phone" placeholder="מספר טלפון" class="w-full p-4 bg-gray-100 rounded-xl outline-none focus:ring-2 ring-blue-500 border-none shadow-inner">
                <button onclick="startApp()" class="w-full bg-blue-600 text-white font-bold py-5 rounded-xl shadow-lg hover:bg-blue-700 transition-all text-lg">אשר והתחל לקבל התראות</button>
            </div>

            <!-- Home Screen (Hidden until login) -->
            <div id="main-section" class="hidden space-y-6">
                
                <!-- Action Button -->
                <button onclick="postMinyanRequest()" class="w-full bg-red-500 text-white p-6 rounded-2xl shadow-xl font-black text-xl pulse hover:bg-red-600 active:scale-95 transition-all">
                    📢 חסר לי עשירי עכשיו!
                </button>

                <div id="map"></div>

                <!-- Live Updates Area -->
                <div>
                    <h3 class="font-bold text-lg flex items-center gap-2 mb-3">
                        <span class="w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
                        התארגנויות בסביבה (1 ק"מ)
                    </h3>
                    <div id="near-list" class="space-y-3">
                        <div class="p-6 border-2 border-dashed border-gray-200 rounded-2xl text-center text-gray-400 italic">
                            מחפש מניינים קרובים...
                        </div>
                    </div>
                </div>

                <!-- Static Synagogues -->
                <div>
                    <h3 class="font-bold text-lg mb-3">בתי כנסת קבועים</h3>
                    <div id="shul-list" class="space-y-3 opacity-80">
                        <!-- Loaded from Code -->
                    </div>
                </div>
            </div>
        </main>

        <footer class="p-4 text-center border-t text-gray-400 text-[10px]">
             המערכת מסירה בקשות ישנות באופן אוטומטי לאחר שעה.
        </footer>
    </div>

    <script>
        // --- מפתחות ה-API שלך שהתקבלו מגוגל ---
        const firebaseConfig = {
            apiKey: "AIzaSyAg0jP2EHnCkNJFxyaaY-CrHDjntYm4Oao",
            authDomain: "munyan-3d2dc.firebaseapp.com",
            databaseURL: "https://munyan-3d2dc-default-rtdb.firebaseio.com",
            projectId: "munyan-3d2dc",
            storageBucket: "munyan-3d2dc.firebasestorage.app",
            messagingSenderId: "145100344366",
            appId: "1:145100344366:web:daef855ba6e695c4c923bf",
            measurementId: "G-QD72K70X1Q"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let userCoords = null;
        let userData = { name: "", phone: "" };
        let map, userMarker;

        async function startApp() {
            const name = document.getElementById('user-name').value;
            const phone = document.getElementById('user-phone').value;
            
            if (!name || !phone) return alert("נא למלא את כל הפרטים");
            userData = { name, phone };

            // בקשת מיקום
            navigator.geolocation.getCurrentPosition(position => {
                userCoords = [position.coords.latitude, position.coords.longitude];
                
                // בקשת התראות
                Notification.requestPermission();

                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');

                initMap();
                listenForMinyans();
                loadStaticShuls();
            }, () => {
                alert("חובה לאשר מיקום כדי להשתתף בחיפוש מניין");
            });
        }

        function initMap() {
            map = L.map('map').setView(userCoords, 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            userMarker = L.marker(userCoords).addTo(map).bindPopup("אתה כאן").openPopup();
        }

        // שליחת בקשה למניין
        function postMinyanRequest() {
            db.collection("requests").add({
                name: userData.name,
                phone: userData.phone,
                lat: userCoords[0],
                lng: userCoords[1],
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("הודעתך פורסמה! אנשים בסביבה יקבלו התראה.");
            });
        }

        // האזנה לבקשות של אחרים בזמן אמת
        function listenForMinyans() {
            const oneHourAgo = new Date(Date.now() - 3600000);
            
            db.collection("requests")
                .where("timestamp", ">", oneHourAgo)
                .onSnapshot(snapshot => {
                    const listDiv = document.getElementById('near-list');
                    listDiv.innerHTML = "";
                    
                    if (snapshot.empty) {
                        listDiv.innerHTML = '<p class="text-center p-4 italic text-gray-400">אין מחפשים כרגע</p>';
                        return;
                    }

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const distance = getDistance(userCoords[0], userCoords[1], data.lat, data.lng);

                        if (distance <= 1) { // 1 ק"מ רדיוס
                            renderCard(data, distance);
                            
                            // התראה לנייד אם זה לא אני
                            if (data.phone !== userData.phone) {
                                triggerNativeAlert(data.name, distance);
                            }
                        }
                    });
                });
        }

        function renderCard(data, dist) {
            const distMeters = Math.round(dist * 1000);
            const wazeUrl = `https://waze.com/ul?ll=${data.lat},${data.lng}&navigate=yes`;
            const googleUrl = `https://www.google.com/maps/dir/?api=1&destination=${data.lat},${data.lng}&travelmode=walking`;

            document.getElementById('near-list').innerHTML += `
                <div class="minyan-card bg-white p-5 rounded-2xl shadow-md border flex flex-col gap-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-black text-lg text-slate-800">${data.name} מחפש מניין</div>
                            <div class="text-red-500 font-bold text-sm">📍 נמצא במרחק ${distMeters} מטר ממך</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-2">
                        <a href="${wazeUrl}" target="_blank" class="bg-[#33CCFF] text-white text-center py-2 rounded-lg text-xs font-bold shadow-sm">🚙 ניווט Waze</a>
                        <a href="${googleUrl}" target="_blank" class="bg-[#4285F4] text-white text-center py-2 rounded-lg text-xs font-bold shadow-sm">🚶 הליכה Google</a>
                    </div>
                </div>`;
        }

        function triggerNativeAlert(name, dist) {
            if (Notification.permission === "granted") {
                new Notification("מניין מתארגן לידך!", {
                    body: `${name} מחפש עשירי במרחק ${Math.round(dist*1000)} מטר`,
                    icon: "https://cdn-icons-png.flaticon.com/512/2903/2903531.png"
                });
                if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
            }
        }

        function loadStaticShuls() {
            // כאן אפשר בעתיד למשוך מטבלה ב-Firebase
            const dummyShuls = [
                { name: "בית כנסת המרכזי", times: "ערבית: 19:30, 20:00" },
                { name: "זכרון משה - שטיבלאך", times: "מניינים כל 15 דקות" }
            ];
            const shulDiv = document.getElementById('shul-list');
            dummyShuls.forEach(shul => {
                shulDiv.innerHTML += `
                    <div class="bg-gray-100 p-3 rounded-lg border-r-4 border-green-500 flex justify-between items-center">
                        <div><div class="font-bold text-sm">${shul.name}</div><div class="text-[10px] text-gray-500">${shul.times}</div></div>
                        <span class="text-xs">⛪</span>
                    </div>`;
            });
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2-lat1) * Math.PI / 180;
            const dLon = (lon2-lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
</html>
