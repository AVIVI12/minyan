<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MinyanLive PRO+</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100">
<div class="max-w-md mx-auto bg-white min-h-screen flex flex-col">

<header class="bg-black text-white p-3 flex justify-between">
<div>
<b>MinyanLive PRO+</b>
<div id="clock" class="text-xs"></div>
</div>
<div id="loc" class="text-xs">טוען...</div>
</header>

<section id="auth" class="screen active p-6 space-y-3">
<input id="phone" placeholder="טלפון" class="p-3 border w-full" />
<div id="recaptcha"></div>
<button onclick="sendCode()" class="bg-blue-600 text-white p-3 w-full">שלח קוד</button>
<input id="code" placeholder="קוד SMS" class="p-3 border w-full" />
<button onclick="verifyCode()" class="bg-green-600 text-white p-3 w-full">אימות</button>
</section>

<section id="main" class="screen p-3 space-y-3">
<div id="map" style="height:180px"></div>
<button onclick="createMinyan()" class="bg-green-600 text-white p-2">פתח מניין</button>
<div id="list"></div>
</section>

</div>

<script>
const firebaseConfig={apiKey:"AIza...",authDomain:"munyan-3d2dc.firebaseapp.com",projectId:"munyan-3d2dc"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const auth=firebase.auth();

let user=null,pos=null,map,userMarker;

setInterval(()=>{
document.getElementById('clock').innerText=new Date().toLocaleTimeString('he-IL');
},1000);

window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha');

function sendCode(){
const phone=document.getElementById('phone').value;
auth.signInWithPhoneNumber(phone,window.recaptchaVerifier)
.then(res=>window.confirmationResult=res);
}

function verifyCode(){
const code=document.getElementById('code').value;
confirmationResult.confirm(code).then(res=>{
user=res.user;
init();
});
}

function init(){
navigator.geolocation.getCurrentPosition(p=>{
pos={lat:p.coords.latitude,lng:p.coords.longitude};
document.getElementById('loc').innerText='📍 נמצא';
show('main');
initMap();
listen();
startGeoUpdates();
});
}

function startGeoUpdates(){
setInterval(()=>{
navigator.geolocation.getCurrentPosition(p=>{
pos={lat:p.coords.latitude,lng:p.coords.longitude};
updateMarker();
});
},30000);
}

function initMap(){
map=L.map('map').setView([pos.lat,pos.lng],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
userMarker=L.marker([pos.lat,pos.lng]).addTo(map);
}

function updateMarker(){
if(userMarker) map.removeLayer(userMarker);
userMarker=L.marker([pos.lat,pos.lng]).addTo(map);
}

function show(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

async function createMinyan(){
const snap=await db.collection('minyanim').where('uid','==',user.uid).get();
if(!snap.empty) return alert('כבר פתחת מניין');

const place=await getPlaceName();

await db.collection('minyanim').add({
uid:user.uid,
lat:pos.lat,lng:pos.lng,
place,
participants:[user.uid],
createdAt:Date.now()
});
}

function listen(){
db.collection('minyanim').onSnapshot(snap=>{
let arr=[];
snap.forEach(d=>arr.push({id:d.id,...d.data()}));
arr=smartSort(arr);
render(arr);
});
}

function smartSort(arr){
return arr.sort((a,b)=>score(a)-score(b));
}

function score(m){
const d=distance(m);
const people=m.participants.length;
return d*2 - people*0.5;
}

function render(arr){
const el=document.getElementById('list');
el.innerHTML='';

let found=false;

arr.forEach(m=>{
const d=distance(m);
if(d>10) return;
found=true;

const full=m.participants.length>=10;
const txt=full?'מלא':'הצטרף';

el.innerHTML+=`<div class="border p-3">
<div>${m.place}</div>
<div>${Math.round(d*1000)} מטר</div>
<div>${m.participants.length}/10</div>
<button onclick="join('${m.id}')" ${full?'disabled':''} class="bg-blue-600 text-white p-2">${txt}</button>
</div>`;

if(m.participants.length==9) push('🔥 חסר אחד!');
});

if(!found) el.innerHTML='<div>אין מניינים קרובים 😕</div>';
}

function join(id){
db.collection('minyanim').doc(id).get().then(doc=>{
const m=doc.data();
if(m.participants.includes(user.uid)) return;
if(m.participants.length>=10) return;

db.collection('minyanim').doc(id).update({
participants:firebase.firestore.FieldValue.arrayUnion(user.uid)
});
});
}

function distance(m){
const R=6371;
const dLat=(m.lat-pos.lat)*Math.PI/180;
const dLon=(m.lng-pos.lng)*Math.PI/180;
const a=Math.sin(dLat/2)**2+Math.cos(pos.lat*Math.PI/180)*Math.cos(m.lat*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

async function getPlaceName(){
try{
const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.lat}&lon=${pos.lng}`);
const d=await r.json();
return d.name||d.display_name;
}catch{return 'מיקום';}
}

// REAL PUSH (service worker required separately)
function push(msg){
if(Notification.permission==='granted') new Notification(msg);
else Notification.requestPermission();
}

</script>
</body>
</html>
