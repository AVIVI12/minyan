<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>מנין.</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body class="bg-gradient-to-b from-blue-50 to-white">

<div class="max-w-md mx-auto min-h-screen bg-white shadow-xl rounded-3xl overflow-hidden flex flex-col">

<!-- HEADER -->
<header class="bg-blue-100 text-blue-600 p-4 text-center font-black text-xl">מנין.</header>

<!-- AUTH -->
<section id="auth" class="p-4 space-y-2">
<input id="phone" placeholder="טלפון" class="p-3 border w-full rounded-xl" />
<div id="recaptcha"></div>
<button onclick="sendCode()" class="bg-blue-500 text-white p-3 w-full rounded-xl">שלח קוד</button>
<input id="code" placeholder="קוד" class="p-3 border w-full rounded-xl" />
<button onclick="verifyCode()" class="bg-green-500 text-white p-3 w-full rounded-xl">אימות</button>
</section>

<!-- MAIN -->
<section id="main" class="hidden flex-1 p-3 space-y-3 overflow-y-auto">
<div id="map" class="h-40 rounded-2xl"></div>
<div id="list"></div>
</section>

<!-- FLOAT BUTTON -->
<button onclick="openModal()" class="fixed bottom-6 right-6 bg-blue-500 text-white w-14 h-14 rounded-full text-2xl shadow-xl">+</button>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center">
<div class="bg-white p-4 rounded-2xl w-80 space-y-2">
<input id="shulName" placeholder="שם בית כנסת" class="p-2 border w-full rounded" />
<input id="address" placeholder="כתובת (חיפוש חובה)" class="p-2 border w-full rounded" />
<input id="shacharit" placeholder="שחרית" class="p-2 border w-full rounded" />
<input id="mincha" placeholder="מנחה" class="p-2 border w-full rounded" />
<input id="arvit" placeholder="ערבית" class="p-2 border w-full rounded" />
<button onclick="saveShul()" class="bg-blue-500 text-white w-full p-2 rounded">שמור</button>
<button onclick="closeModal()" class="text-red-500 w-full">סגור</button>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIza...",authDomain:"munyan-3d2dc.firebaseapp.com",projectId:"munyan-3d2dc"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const auth=firebase.auth();

let user,pos,map;

window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha');

function sendCode(){
const phone=document.getElementById('phone').value;
auth.signInWithPhoneNumber(phone,window.recaptchaVerifier)
.then(r=>window.confirmationResult=r);
}

function verifyCode(){
confirmationResult.confirm(document.getElementById('code').value)
.then(res=>{
user=res.user;
init();
});
}

function init(){
document.getElementById('auth').classList.add('hidden');
document.getElementById('main').classList.remove('hidden');

navigator.geolocation.getCurrentPosition(p=>{
pos={lat:p.coords.latitude,lng:p.coords.longitude};
initMap();
listen();
});
}

function initMap(){
map=L.map('map').setView([pos.lat,pos.lng],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
L.marker([pos.lat,pos.lng]).addTo(map);
}

function listen(){
db.collection('shuls').onSnapshot(snap=>{
let html='';

snap.forEach(d=>{
const s=d.data();
const dist=getDist(pos.lat,pos.lng,s.lat,s.lng);
if(dist>5) return;

html+=`<div class="bg-blue-50 p-3 rounded-xl mb-2">
<b>${s.name}</b>
<div>${s.address}</div>
<div>שחרית: ${s.shacharit}</div>
<div>מנחה: ${s.mincha}</div>
<div>ערבית: ${s.arvit}</div>
<button onclick="createMinyan('${d.id}','שחרית')">+ שחרית</button>
<button onclick="createMinyan('${d.id}','מנחה')">+ מנחה</button>
<button onclick="createMinyan('${d.id}','ערבית')">+ ערבית</button>
</div>`;
});

document.getElementById('list').innerHTML=html||'אין בתי כנסת';
});
}

function openModal(){document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}

async function saveShul(){
const address=document.getElementById('address').value;
if(!address) return alert('חייב כתובת');

// שימוש ב־Nominatim (תחליף לגוגל בסיסי)
const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${address}`);
const data=await res.json();
if(!data.length) return alert('כתובת לא נמצאה');

const lat=parseFloat(data[0].lat);
const lng=parseFloat(data[0].lon);

await db.collection('shuls').add({
name:document.getElementById('shulName').value,
address,
lat,lng,
shacharit:document.getElementById('shacharit').value,
mincha:document.getElementById('mincha').value,
arvit:document.getElementById('arvit').value
});

closeModal();
}

function createMinyan(shulId,prayer){
db.collection('minyanim').add({
shulId,
prayer,
people:[user.uid],
createdAt:Date.now()
});
push('נפתח מניין חדש');
}

function getDist(lat1,lon1,lat2,lon2){
const R=6371;
const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;
const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// PUSH אמיתי (Service Worker חובה)
function push(msg){
if(Notification.permission==='granted') new Notification(msg);
else Notification.requestPermission();
}

</script>
</body>
