<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MinyanLive PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}
#map{height:180px;border-radius:20px}
</style>
</head>
<body class="bg-gray-100">
<div class="max-w-md mx-auto bg-white min-h-screen flex flex-col">

<header class="bg-black text-white p-3 flex justify-between">
<div>
<b>MinyanLive PRO</b>
<div id="clock" class="text-xs"></div>
</div>
<div id="loc" class="text-xs">טוען מיקום...</div>
</header>

<section id="auth" class="screen active p-6 space-y-3">
<input id="name" placeholder="שם" class="p-3 border w-full" />
<input id="phone" placeholder="טלפון" class="p-3 border w-full" />
<button onclick="register()" class="bg-blue-600 text-white p-3 w-full">כניסה</button>
</section>

<section id="main" class="screen p-3 space-y-3">
<div id="map"></div>
<button onclick="createMinyan()" class="bg-green-600 text-white p-2">פתח מניין</button>
<div id="list"></div>
</section>

</div>

<script>
const firebaseConfig={apiKey:"AIza...",projectId:"munyan-3d2dc"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let user=JSON.parse(localStorage.getItem('u'))||null;
let pos=null;
let map,userMarker;

setInterval(()=>{
document.getElementById('clock').innerText=new Date().toLocaleTimeString('he-IL');
},1000);

if(user){init();}

function register(){
const name=document.getElementById('name').value;
const phone=document.getElementById('phone').value;
if(!name||!phone) return alert('מלא הכל');
user={name,phone};
localStorage.setItem('u',JSON.stringify(user));
init();
}

function init(){
navigator.geolocation.getCurrentPosition(p=>{
pos={lat:p.coords.latitude,lng:p.coords.longitude};
document.getElementById('loc').innerText='📍 נמצא';
show('main');
initMap();
listen();
},()=>alert('חייבים מיקום'));
}

function initMap(){
map=L.map('map').setView([pos.lat,pos.lng],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
userMarker=L.marker([pos.lat,pos.lng]).addTo(map);
}

function show(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

async function createMinyan(){
const exists=await db.collection('minyanim').where('phone','==',user.phone).get();
if(!exists.empty) return alert('כבר פתחת');

const place=await getPlaceName(pos.lat,pos.lng);

await db.collection('minyanim').add({
creator:user.name,
phone:user.phone,
lat:pos.lat,lng:pos.lng,
place,
participants:[user],
createdAt:new Date()
});
}

function listen(){
db.collection('minyanim').onSnapshot(snap=>{
const arr=[];
snap.forEach(d=>arr.push({id:d.id,...d.data()}));
arr.sort((a,b)=>dist(a)-dist(b));
render(arr);
});
}

function render(arr){
const el=document.getElementById('list');
el.innerHTML='';
arr.forEach(m=>{
const d=dist(m);
if(d>5) return;
const full=m.participants.length>=10;
const color=full?'green':m.participants.length>=6?'orange':'red';
const btn=full?'מלא':`הצטרף`;

el.innerHTML+=`<div class="border p-3">
<b>${m.creator}</b>
<div>${m.place}</div>
<div>${Math.round(d*1000)} מטר</div>
<div>${m.participants.length}/10</div>
<button onclick="join('${m.id}')" ${full?'disabled':''} class="bg-${color}-500 text-white p-2">${btn}</button>
</div>`;

if(m.participants.length==9) notify('חסר אחד לעשירי!');
});
}

function join(id){
db.collection('minyanim').doc(id).get().then(doc=>{
const m=doc.data();
if(m.participants.length>=10) return alert('מלא');

const exists=m.participants.find(p=>p.phone===user.phone);
if(exists) return;

 db.collection('minyanim').doc(id).update({
 participants:firebase.firestore.FieldValue.arrayUnion(user)
 });
});
}

function dist(m){
const R=6371;
const dLat=(m.lat-pos.lat)*Math.PI/180;
const dLon=(m.lng-pos.lng)*Math.PI/180;
const a=Math.sin(dLat/2)**2+Math.cos(pos.lat*Math.PI/180)*Math.cos(m.lat*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

async function getPlaceName(lat,lng){
try{
const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
const data=await res.json();
return data.name||data.display_name||'מיקום';
}catch{return 'מיקום';}
}

// Notifications
function notify(text){
if(Notification.permission==='granted'){
new Notification(text);
}else if(Notification.permission!=='denied'){
Notification.requestPermission();
}
}

</script>
</body>
</html>
