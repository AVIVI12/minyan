<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מניין לייב - הכל במקום אחד</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Leaflet Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        #map { height: 250px; border-radius: 16px; z-index: 10; }
        .tab-active { border-bottom: 4px solid #1e40af; color: #1e40af; font-weight: bold; }
        .minyan-card { border-right: 5px solid #ef4444; }
        .shul-card { border-right: 5px solid #10b981; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .pulse-btn { animation: pulse-red 2s infinite; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-slate-900">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col">
        <!-- Header -->
        <header class="bg-blue-700 text-white p-5 shadow-md">
            <h1 class="text-2xl font-black italic">MinyanLive</h1>
            <p class="text-xs opacity-80">מנצחים את המרחק, מתפללים יחד</p>
        </header>

        <!-- Tabs Navigation -->
        <div class="flex bg-white border-b sticky top-0 z-50">
            <button onclick="switchTab('live')" id="tab-live" class="flex-1 py-4 text-center tab-active transition-all">מניין עכשיו</button>
            <button onclick="switchTab('shuls')" id="tab-shuls" class="flex-1 py-4 text-center text-gray-500 transition-all">בתי כנסת</button>
        </div>

        <main class="p-4 flex-grow">
            
            <!-- Auth Screen -->
            <div id="auth-section" class="py-10 space-y-4">
                <div class="text-center mb-6">
                    <span class="text-5xl">🕍</span>
                    <h2 class="text-xl font-bold mt-2">ברוך הבא למניין לייב</h2>
                </div>
                <input type="text" id="user-name" placeholder="שם מלא" class="w-full p-4 border rounded-xl outline-none focus:ring-2 ring-blue-500">
                <input type="tel" id="user-phone" placeholder="מספור טלפון" class="w-full p-4 border rounded-xl outline-none focus:ring-2 ring-blue-500">
                <button onclick="initialize()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg">כניסה למערכת</button>
            </div>

            <!-- Tab 1: Live Minyan -->
            <div id="section-live" class="hidden space-y-6">
                <button onclick="openMinyanForm()" class="w-full bg-red-500 text-white py-5 rounded-2xl shadow-xl font-bold text-xl pulse-btn">
                    📢 פתח התארגנות למניין!
                </button>

                <div id="map" class="shadow-inner"></div>

                <div class="space-y-3">
                    <h3 class="font-bold text-lg flex items-center gap-2">
                        <span class="w-2 h-2 bg-red-500 rounded-full animate-ping"></span>
                        התארגנויות בסביבה
                    </h3>
                    <div id="live-requests" class="space-y-4">
                        <!-- מניינים חיים יופיעו כאן -->
                    </div>
                </div>
            </div>

            <!-- Tab 2: Synagogues -->
            <div id="section-shuls" class="hidden space-y-6">
                <div class="bg-green-50 p-4 rounded-xl border border-green-200">
                    <h3 class="font-bold text-green-800">מכיר בית כנסת שלא מופיע?</h3>
                    <p class="text-xs text-green-600 mb-3">עדכן את הקהילה וזכה במצווה</p>
                    <button onclick="showAddShulForm()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold">הוסף/עדכן בית כנסת +</button>
                </div>

                <div id="shul-list" class="space-y-4">
                    <!-- רשימת בתי כנסת מה-DB -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <!-- Form: Add Shul -->
    <div id="modal-shul" class="fixed inset-0 bg-black/50 hidden z-[100] p-6 flex items-center justify-center">
        <div class="bg-white w-full rounded-2xl p-6 space-y-4 shadow-2xl">
            <h3 class="font-bold text-xl border-b pb-2">הוספת בית כנסת</h3>
            <input type="text" id="shul-name" placeholder="שם בית הכנסת" class="w-full p-3 border rounded-lg">
            <input type="text" id="shul-times" placeholder="שעות תפילה (למשל: מנחה: 19:00)" class="w-full p-3 border rounded-lg">
            <div class="flex gap-2">
                <button onclick="saveShul()" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold">שמור</button>
                <button onclick="closeModal('modal-shul')" class="flex-1 bg-gray-200 py-3 rounded-xl">ביטול</button>
            </div>
        </div>
    </div>

    <script>
        // חיבור ל-Firebase שלך
        const firebaseConfig = {
            apiKey: "AIzaSyAg0jP2EHnCkNJFxyaaY-CrHDjntYm4Oao",
            authDomain: "munyan-3d2dc.firebaseapp.com",
            databaseURL: "https://munyan-3d2dc-default-rtdb.firebaseio.com",
            projectId: "munyan-3d2dc",
            storageBucket: "munyan-3d2dc.firebasestorage.app",
            messagingSenderId: "145100344366",
            appId: "1:145100344366:web:daef855ba6e695c4c923bf",
            measurementId: "G-QD72K70X1Q"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let userPos = null;
        let userData = { name: "", phone: "" };
        let map, userMarker;

        async function initialize() {
            userData.name = document.getElementById('user-name').value;
            userData.phone = document.getElementById('user-phone').value;
            if(!userData.name || !userData.phone) return alert("מלא פרטים");

            navigator.geolocation.getCurrentPosition(pos => {
                userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                document.getElementById('auth-section').classList.add('hidden');
                switchTab('live');
                initMap();
                listenToLiveMinyans();
                loadShuls();
            });
        }

        function initMap() {
            map = L.map('map').setView([userPos.lat, userPos.lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            userMarker = L.marker([userPos.lat, userPos.lng]).addTo(map).bindPopup("אתה כאן").openPopup();
        }

        function switchTab(tab) {
            document.getElementById('section-live').classList.add('hidden');
            document.getElementById('section-shuls').classList.add('hidden');
            document.getElementById('tab-live').classList.remove('tab-active');
            document.getElementById('tab-shuls').classList.remove('tab-active');

            document.getElementById('section-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('tab-active');
        }

        // --- לוגיקת מניין חי ---
        function openMinyanForm() {
            if(confirm("לפתוח בקשה למניין במיקום הנוכחי שלך?")) {
                db.collection("active_minyans").add({
                    creator: userData.name,
                    phone: userData.phone,
                    lat: userPos.lat,
                    lng: userPos.lng,
                    joined: 1,
                    participants: [userData.phone],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        }

        function listenToLiveMinyans() {
            const hourAgo = new Date(Date.now() - 3600000);
            db.collection("active_minyans").where("createdAt", ">", hourAgo)
                .onSnapshot(snap => {
                    const list = document.getElementById('live-requests');
                    list.innerHTML = "";
                    snap.forEach(doc => {
                        const data = doc.data();
                        const dist = calculateDistance(userPos.lat, userPos.lng, data.lat, data.lng);
                        if(dist <= 1) renderMinyanCard(doc.id, data, dist);
                    });
                });
        }

        function renderMinyanCard(id, data, dist) {
            const isJoined = data.participants.includes(userData.phone);
            const progress = (data.joined / 10) * 100;
            
            document.getElementById('live-requests').innerHTML += `
                <div class="minyan-card bg-white p-5 rounded-2xl shadow-md space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-bold text-lg">${data.creator} מחפש מניין</div>
                            <div class="text-xs text-red-500 font-bold">📍 ${Math.round(dist*1000)} מטר ממך</div>
                        </div>
                        <div class="text-2xl font-black text-blue-600">${data.joined}/10</div>
                    </div>
                    <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden">
                        <div class="bg-blue-600 h-full transition-all" style="width: ${progress}%"></div>
                    </div>
                    <div class="flex gap-2">
                        ${!isJoined ? `<button onclick="joinMinyan('${id}')" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold">אני מצטרף!</button>` : `<span class="flex-1 text-center text-green-600 font-bold py-2">אתה רשום ✅</span>`}
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${data.lat},${data.lng}&travelmode=walking" class="bg-gray-100 p-2 rounded-lg">🚶</a>
                    </div>
                </div>`;
        }

        async function joinMinyan(id) {
            const ref = db.collection("active_minyans").doc(id);
            const doc = await ref.get();
            if(!doc.exists) return;
            
            const data = doc.data();
            if(!data.participants.includes(userData.phone)) {
                ref.update({
                    joined: firebase.firestore.FieldValue.increment(1),
                    participants: firebase.firestore.FieldValue.arrayUnion(userData.phone)
                });
            }
        }

        // --- לוגיקת בתי כנסת ---
        function showAddShulForm() { document.getElementById('modal-shul').classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function saveShul() {
            const name = document.getElementById('shul-name').value;
            const times = document.getElementById('shul-times').value;
            if(!name || !times) return alert("מלא את כל השדות");

            db.collection("synagogues").add({
                name, times, lat: userPos.lat, lng: userPos.lng, updater: userData.name
            }).then(() => {
                closeModal('modal-shul');
                alert("תודה! בית הכנסת נוסף למפה.");
            });
        }

        function loadShuls() {
            db.collection("synagogues").onSnapshot(snap => {
                const list = document.getElementById('shul-list');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const data = doc.data();
                    const dist = calculateDistance(userPos.lat, userPos.lng, data.lat, data.lng);
                    if(dist <= 3) { // הצג בתי כנסת עד 3 ק"מ
                        list.innerHTML += `
                            <div class="shul-card bg-white p-4 rounded-xl shadow-sm border">
                                <div class="flex justify-between items-center">
                                    <div class="font-bold">${data.name}</div>
                                    <div class="text-[10px] text-gray-400">מעודכן ע"י ${data.updater || 'אנונימי'}</div>
                                </div>
                                <div class="text-sm text-slate-600 my-2">${data.times}</div>
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-bold text-green-600">${Math.round(dist*1000)} מטר ממך</span>
                                    <a href="https://waze.com/ul?ll=${data.lat},${data.lng}&navigate=yes" class="text-blue-500 text-xs underline">ניווט מהיר</a>
                                </div>
                            </div>`;
                    }
                });
            });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2-lat1) * Math.PI / 180;
            const dLon = (lon2-lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
</html>
